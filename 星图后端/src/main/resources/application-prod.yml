spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/knowledge_star_map?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT}

logging:
  level:
    com.knowledgestarmap: info
    org.springframework.security: warn
    org.mybatis: warn
